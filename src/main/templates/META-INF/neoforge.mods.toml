modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CFF1028"
logoFile="icon.png"
description='''
Compatibility patch for Create Simulated/Aeronautics and Modern UI on Minecraft 1.21.1.
Relocates Simulated's custom creative-tab section banners so Modern UI tooltip shadows blend over them correctly.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="simulated"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="modernui"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
